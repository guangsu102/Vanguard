# XBoard Bot Matrix Configuration
# 所有配置项可通过环境变量覆盖

app:
  log_level: "DEBUG"

# Telegram 用户账号矩阵
telegram:
  # 模块 A: 引流空投账号矩阵
  lead_gen:
    - name: "引流主号1"
      enabled: true
      session_name: "lead_gen_main_1"
      phone: "${LEAD_GEN_MAIN1_PHONE}"
      api_id: ${LEAD_GEN_MAIN1_API_ID}
      api_hash: "${LEAD_GEN_MAIN1_API_HASH}"
    - name: "引流辅号1"
      enabled: true
      session_name: "lead_gen_aux1_1"
      phone: "${LEAD_GEN_AUX1_PHONE}"
      api_id: ${LEAD_GEN_AUX1_API_ID}
      api_hash: "${LEAD_GEN_AUX1_API_HASH}"

  # 模块 B: 运营客服账号矩阵
  service:
    - name: "客服1号"
      enabled: true
      session_name: "service_1"
      phone: "${SERVICE_PHONE_1}"
      api_id: ${SERVICE_API_ID_1}
      api_hash: "${SERVICE_API_HASH_1}"

  # 模块 C: 社群管理账号矩阵
  group_ops:
    - name: "管理员1号"
      enabled: true
      session_name: "admin_1"
      phone: "${ADMIN_PHONE_1}"
      api_id: ${ADMIN_API_ID_1}
      api_hash: "${ADMIN_API_HASH_1}"

  # 强制订阅的官方频道
  official_channels:
    - "@YourOfficialChannel1"

# XBoard API 配置
xboard_api:
  base_url: "${XBOARD_API_URL}"
  api_key: "${XBOARD_API_KEY}"
  timeout: 30
  retry_times: 3
  retry_delay: 5

# 数据库配置
database:
  host: "${POSTGRES_HOST:localhost}"
  port: ${POSTGRES_PORT:5432}
  user: "${POSTGRES_USER:xboard_bot}"
  password: "${POSTGRES_PASSWORD}"
  database: "${POSTGRES_DB:xboard_bot_matrix}"

# Redis 配置
redis:
  host: "${REDIS_HOST:localhost}"
  port: ${REDIS_PORT:6379}
  password: "${REDIS_PASSWORD:}"
  db: 0

# ============ 模块 A: 引流空投配置 ============
lead_gen:
  # 防封号配置
  anti_ban:
    message_interval: 30           # 发消息间隔（秒）
    max_messages_per_day: 30       # 每账号每天最大消息数
    max_groups_per_day: 10        # 每天最大加群数
    typing_delay: [2000, 8000]    # 打字延迟（毫秒）
    random_timing: true

# ============ 模块 B: 核心运营配置 ============
service:
  checkin:
    enabled: true
    min_traffic_mb: 100
    max_traffic_mb: 1024
    cooldown_hours: 24

  abandoned_cart:
    enabled: true
    unpaid_timeout_minutes: 30
    discount_percent: 20
    coupon_validity_hours: 2

  poster:
    width: 800
    height: 1200
    qr_size: 200
    output_dir: "./assets/posters"

# ============ 模块 C: 社群风纪配置 ============
group_ops:
  competitor_keywords:
    - "机场|节点出售|翻墙|VPN"
    - "t\\.me/\\w+"
    - "(aff|邀请).*t\\.me"
    - "\\.vip|\\.xyz|\\.top"

  warning:
    max_warnings: 3
    ban_duration_hours: 0

  node_report:
    enabled: true
    schedule: "20:30"

# 监控与告警
monitoring:
  admin_chat_id: "${ADMIN_CHAT_ID:}"
  node_report_chat_id: "${NODE_REPORT_CHAT_ID:}"
