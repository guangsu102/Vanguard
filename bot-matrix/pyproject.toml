[project]
name = "xboard-bot-matrix"
version = "1.0.0"
description = "XBoard Telegram Automated Marketing Matrix (User Account)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "XBoard Team"}
]
dependencies = [
    "telethon>=1.35.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "Pillow>=10.3.0",
    "qrcode[pil]>=7.4.2",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "sentry-sdk>=2.2.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.4",
    "cryptg>=2.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "black>=24.4.2",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = ["migrations", ".venv"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
