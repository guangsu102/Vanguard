# XBoard Telegram Bot Matrix - Docker Compose

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: xboard_postgres
    environment:
      POSTGRES_USER: xboard_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xboard_bot_password}
      POSTGRES_DB: xboard_bot_matrix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xboard_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bot_matrix_network

  # Redis 缓存与队列
  redis:
    image: redis:7-alpine
    container_name: xboard_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bot_matrix_network

  # Bot Matrix 主服务
  bot-matrix:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: xboard_bot_matrix
    environment:
      # Telegram Bot Tokens
      LEAD_GEN_BOT_TOKEN: ${LEAD_GEN_BOT_TOKEN}
      SERVICE_BOT_TOKEN: ${SERVICE_BOT_TOKEN}
      GROUP_OPS_BOT_TOKEN: ${GROUP_OPS_BOT_TOKEN}

      # XBoard API
      XBOARD_API_URL: ${XBOARD_API_URL:-http://xboard:8080/api}
      XBOARD_API_KEY: ${XBOARD_API_KEY}

      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: xboard_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xboard_bot_password}
      POSTGRES_DB: xboard_bot_matrix

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # 监控
      SENTRY_DSN: ${SENTRY_DSN:-}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
    volumes:
      - ./assets/posters:/app/assets/posters
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bot_matrix_network

  # XBoard 主系统（可选，如果需要和主系统一起部署）
  # xboard:
  #   image: xboard:latest
  #   container_name: xboard_main
  #   environment:
  #     APP_ENV: production
  #     APP_DEBUG: "false"
  #     DB_HOST: xboard_db
  #     DB_PORT: 3306
  #     DB_DATABASE: xboard
  #     DB_USERNAME: xboard
  #     DB_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - xboard_data:/var/www/html/storage
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - xboard_db
  #   networks:
  #     - bot_matrix_network
  #   restart: unless-stopped

  # Nginx 反向代理（可选）
  # nginx:
  #   image: nginx:alpine
  #   container_name: xboard_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #     - ./nginx/ssl:/etc/nginx/ssl
  #   depends_on:
  #     - xboard
  #     - bot-matrix
  #   networks:
  #     - bot_matrix_network
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # xboard_data:
  #   driver: local

networks:
  bot_matrix_network:
    driver: bridge
