# ===========================================
# Vanguard Production Docker Compose
# Target: oracle4c24g / vanguard.pipenai.xyz
# This stack owns its PostgreSQL and Redis volumes and does not touch the
# co-located Sub2API stack.
# ===========================================

name: vanguard

services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:15-alpine
    container_name: vanguard-postgres
    env_file:
      - .env.production
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - vanguard-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vanguard} -d $${POSTGRES_DB:-vanguard}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: vanguard-redis
    env_file:
      - .env.production
    command:
      ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\" --maxmemory 512mb --maxmemory-policy allkeys-lru"]
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    networks:
      - vanguard-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ==================== Backend API ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-backend
    env_file:
      - .env.production
    environment:
      P0_SAFETY_GATE_ENABLED: ${P0_SAFETY_GATE_ENABLED:-true}
      P0_SAFETY_GATE_FAIL_CLOSED: ${P0_SAFETY_GATE_FAIL_CLOSED:-true}
      OWNED_GROUP_MODULE_ENABLED: ${OWNED_GROUP_MODULE_ENABLED:-true}
      OWNED_GROUP_EXECUTION_ENABLED: ${OWNED_GROUP_EXECUTION_ENABLED:-false}
      OWNED_GROUP_GOVERNANCE_ENABLED: ${OWNED_GROUP_GOVERNANCE_ENABLED:-false}
      OWNED_GROUP_MESSAGING_ENABLED: ${OWNED_GROUP_MESSAGING_ENABLED:-false}
      OWNED_GROUP_AI_PERSONA_ENABLED: ${OWNED_GROUP_AI_PERSONA_ENABLED:-false}
      OWNED_GROUP_KILL_SWITCH_ENABLED: ${OWNED_GROUP_KILL_SWITCH_ENABLED:-false}
      OWNED_GROUP_ROLLOUT_MAX_ACCOUNTS: ${OWNED_GROUP_ROLLOUT_MAX_ACCOUNTS:-2}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8000"
    networks:
      - vanguard-internal
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
      - ./sessions:/app/sessions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  # ==================== Celery Workers ====================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-celery-worker
    env_file:
      - .env.production
    environment:
      CELERY_WORKER_CONCURRENCY: "2"
      CELERY_WORKER_PREFETCH_MULTIPLIER: "1"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "50"
      CELERY_OWNED_GROUP_CONCURRENCY: ${CELERY_OWNED_GROUP_CONCURRENCY:-1}
      P0_SAFETY_GATE_ENABLED: ${P0_SAFETY_GATE_ENABLED:-true}
      P0_SAFETY_GATE_FAIL_CLOSED: ${P0_SAFETY_GATE_FAIL_CLOSED:-true}
      OWNED_GROUP_MODULE_ENABLED: ${OWNED_GROUP_MODULE_ENABLED:-true}
      OWNED_GROUP_EXECUTION_ENABLED: ${OWNED_GROUP_EXECUTION_ENABLED:-false}
      OWNED_GROUP_MESSAGING_ENABLED: ${OWNED_GROUP_MESSAGING_ENABLED:-false}
      OWNED_GROUP_AI_PERSONA_ENABLED: ${OWNED_GROUP_AI_PERSONA_ENABLED:-false}
      OWNED_GROUP_KILL_SWITCH_ENABLED: ${OWNED_GROUP_KILL_SWITCH_ENABLED:-false}
      OWNED_GROUP_ROLLOUT_MAX_ACCOUNTS: ${OWNED_GROUP_ROLLOUT_MAX_ACCOUNTS:-2}
    restart: on-failure:3
    command: ["python", "-m", "app.core.scheduler.worker", "multi"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vanguard-internal
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
      - ./sessions:/app/sessions
    healthcheck:
      disable: true

  resource-search-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-resource-search-worker
    env_file:
      - .env.production
    environment:
      CELERY_WORKER_CONCURRENCY: "1"
      CELERY_WORKER_PREFETCH_MULTIPLIER: "1"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "20"
    restart: on-failure:3
    command:
      ["python", "-m", "app.core.scheduler.worker", "worker", "-Q", "resource_search", "-H", "resource-search-worker@oracle4c24g"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vanguard-internal
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
      - ./sessions:/app/sessions
    healthcheck:
      disable: true

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-celery-beat
    env_file:
      - .env.production
    environment:
      P0_SAFETY_GATE_ENABLED: ${P0_SAFETY_GATE_ENABLED:-true}
      P0_SAFETY_GATE_FAIL_CLOSED: ${P0_SAFETY_GATE_FAIL_CLOSED:-true}
      OWNED_GROUP_MODULE_ENABLED: ${OWNED_GROUP_MODULE_ENABLED:-true}
      OWNED_GROUP_EXECUTION_ENABLED: ${OWNED_GROUP_EXECUTION_ENABLED:-false}
      OWNED_GROUP_MESSAGING_ENABLED: ${OWNED_GROUP_MESSAGING_ENABLED:-false}
      OWNED_GROUP_AI_PERSONA_ENABLED: ${OWNED_GROUP_AI_PERSONA_ENABLED:-false}
      OWNED_GROUP_KILL_SWITCH_ENABLED: ${OWNED_GROUP_KILL_SWITCH_ENABLED:-false}
      OWNED_GROUP_ROLLOUT_MAX_ACCOUNTS: ${OWNED_GROUP_ROLLOUT_MAX_ACCOUNTS:-2}
    restart: unless-stopped
    command: ["python", "-m", "app.core.scheduler.worker", "beat"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vanguard-internal
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
    healthcheck:
      disable: true

  # ==================== Telegram Workers ====================
  telegram-growth-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-telegram-growth-worker
    env_file:
      - .env.production
    environment:
      OWNED_GROUP_MESSAGING_ENABLED: ${OWNED_GROUP_MESSAGING_ENABLED:-false}
      OWNED_GROUP_AI_PERSONA_ENABLED: ${OWNED_GROUP_AI_PERSONA_ENABLED:-false}
    restart: unless-stopped
    command:
      ["python", "-m", "app.workers.telegram_worker", "--role", "growth_user_worker", "--worker-id", "growth_user_worker:oracle4c24g"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vanguard-internal
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
      - ./sessions:/app/sessions
    healthcheck:
      disable: true

  telegram-guardian-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-telegram-guardian-worker
    env_file:
      - .env.production
    environment:
      OWNED_GROUP_GOVERNANCE_ENABLED: ${OWNED_GROUP_GOVERNANCE_ENABLED:-false}
    restart: unless-stopped
    command:
      ["python", "-m", "app.workers.telegram_worker", "--role", "guardian_bot_worker", "--worker-id", "guardian_bot_worker:oracle4c24g"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vanguard-internal
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
    healthcheck:
      disable: true

  # ==================== Optional NapCatQQ ====================
  napcat:
    profiles: ["qq"]
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:latest}
    container_name: vanguard-napcat
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
    ports:
      - "127.0.0.1:6099:6099"
    expose:
      - "3000"
      - "3001"
    networks:
      - vanguard-internal
    volumes:
      - napcat_qq_data:/app/.config/QQ
      - napcat_config:/app/napcat/config
      - napcat_plugins:/app/napcat/plugins

  qq-onebot-worker:
    profiles: ["qq"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-qq-onebot-worker
    env_file:
      - .env.production
    restart: on-failure:3
    command: ["python", "-m", "app.workers.qq_onebot_worker", "--worker-id", "qq_onebot_worker:oracle4c24g"]
    depends_on:
      backend:
        condition: service_healthy
      napcat:
        condition: service_started
    networks:
      - vanguard-internal
    volumes:
      - ./data/logs:/app/logs
    healthcheck:
      disable: true

  # ==================== Frontend ====================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: vanguard-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:13000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vanguard-internal

  # ==================== Legacy Bot Matrix (optional) ====================
  bot:
    profiles: ["legacy-bot-matrix"]
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: vanguard-bot
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vanguard-internal

  # Run with: docker compose --profile bootstrap run --rm db-init/admin-init
  db-init:
    profiles: ["bootstrap"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-db-init
    env_file:
      - .env.production
    command: ["sh", "-c", "PYTHONPATH=/app python /app/scripts/initialize_database.py && PYTHONPATH=/app python /app/scripts/apply_sql_migrations.py"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vanguard-internal
    restart: "no"

  admin-init:
    profiles: ["bootstrap"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-admin-init
    env_file:
      - .env.production
    command: ["sh", "-c", "PYTHONPATH=/app python /app/scripts/init_admin.py"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - vanguard-internal
    restart: "no"

networks:
  vanguard-internal:
    driver: bridge

volumes:
  napcat_qq_data:
  napcat_config:
  napcat_plugins:
