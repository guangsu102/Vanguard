# ===========================================
# Vanguard Production Docker Compose
# 使用服务器现有的 PostgreSQL 和 Redis
# ===========================================

services:
  # ==================== Backend API ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-backend
    env_file:
      - .env.production
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - default
      - xboard_internal
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
      - ./sessions:/app/sessions

  # ==================== Celery Worker ====================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-celery-worker
    env_file:
      - .env.production
    restart: unless-stopped
    command: ["python", "-m", "app.core.scheduler.worker", "multi"]
    depends_on:
      - backend
    networks:
      - default
      - xboard_internal
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
      - ./sessions:/app/sessions
    healthcheck:
      disable: true

  # ==================== Celery Beat ====================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-celery-beat
    env_file:
      - .env.production
    restart: unless-stopped
    command: ["python", "-m", "app.core.scheduler.worker", "beat"]
    depends_on:
      - backend
    networks:
      - default
      - xboard_internal
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
    healthcheck:
      disable: true

  # ==================== Telegram Growth Worker ====================
  telegram-growth-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-telegram-growth-worker
    env_file:
      - .env.production
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "app.workers.telegram_worker",
        "--role",
        "growth_user_worker",
        "--worker-id",
        "growth_user_worker:production",
      ]
    depends_on:
      - backend
    networks:
      - default
      - xboard_internal
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
      - ./sessions:/app/sessions
    healthcheck:
      disable: true

  # ==================== Telegram Guardian Worker ====================
  telegram-guardian-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-telegram-guardian-worker
    env_file:
      - .env.production
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "app.workers.telegram_worker",
        "--role",
        "guardian_bot_worker",
        "--worker-id",
        "guardian_bot_worker:production",
      ]
    depends_on:
      - backend
    networks:
      - default
      - xboard_internal
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
    healthcheck:
      disable: true

  # ==================== NapCatQQ OneBot 11 ====================
  napcat:
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:latest}
    container_name: vanguard-napcat
    restart: unless-stopped
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
    ports:
      - "127.0.0.1:6099:6099"
    expose:
      - "3000"
      - "3001"
    networks:
      - default
    volumes:
      - napcat_qq_data:/app/.config/QQ
      - napcat_config:/app/napcat/config
      - napcat_plugins:/app/napcat/plugins

  # ==================== QQ OneBot Event Worker ====================
  qq-onebot-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-qq-onebot-worker
    env_file:
      - .env.production
    restart: on-failure:3
    command:
      [
        "python",
        "-m",
        "app.workers.qq_onebot_worker",
        "--worker-id",
        "qq_onebot_worker:production",
      ]
    depends_on:
      - backend
      - napcat
    networks:
      - default
      - xboard_internal
    volumes:
      - ./data/logs:/app/logs
    healthcheck:
      disable: true

  # ==================== Frontend ====================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vanguard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ==================== Bot Matrix (Legacy Reference) ====================
  bot:
    profiles:
      - legacy-bot-matrix
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: vanguard-bot
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - API_BASE_URL=http://localhost:8000
    network_mode: host
    depends_on:
      - backend

networks:
  xboard_internal:
    external: true
    name: xboard_xboard_internal

volumes:
  napcat_qq_data:
  napcat_config:
  napcat_plugins:
