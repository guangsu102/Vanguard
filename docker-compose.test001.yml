version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: vanguard-postgres
    restart: unless-stopped
    env_file:
      - .env.test001
    environment:
      POSTGRES_USER: ${POSTGRES_USER-vanguard}
      POSTGRES_DB: ${POSTGRES_DB-vanguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vanguard} -d $${POSTGRES_DB:-vanguard}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vanguard-internal

  redis:
    image: redis:7-alpine
    container_name: vanguard-redis
    restart: unless-stopped
    env_file:
      - .env.test001
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
      --maxmemory 256mb --maxmemory-policy allkeys-lru'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vanguard-internal

  db-init:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-db-init
    env_file:
      - .env.test001
    command: ["sh", "-c", "PYTHONPATH=/app python /app/scripts/apply_sql_migrations.py"]
    depends_on:
      - postgres
    networks:
      - vanguard-internal
    restart: "no"

  admin-init:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-admin-init
    env_file:
      - .env.test001
    command: ["sh", "-c", "PYTHONPATH=/app python /app/scripts/init_test001_admin.py"]
    depends_on:
      - postgres
    networks:
      - vanguard-internal
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-backend
    env_file:
      - .env.test001
    mem_limit: 1g
    pids_limit: 256
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
      - ./sessions:/app/sessions
    networks:
      - vanguard-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-celery-worker
    env_file:
      - .env.test001
    environment:
      CELERY_WORKER_CONCURRENCY: "2"
      CELERY_WORKER_PREFETCH_MULTIPLIER: "1"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "50"
    mem_limit: 768m
    pids_limit: 128
    restart: on-failure:3
    command:
      [
        "python",
        "-m",
        "app.core.scheduler.worker",
        "worker",
        "-Q",
        "default",
        "health_check",
        "send_messages",
        "proxy_validation",
        "campaign_check",
        "bulk_import",
        "broadcast",
        "automation",
        "qq_commands",
      ]
    depends_on:
      - backend
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
      - ./sessions:/app/sessions
    networks:
      - vanguard-internal
    healthcheck:
      disable: true

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-celery-beat
    env_file:
      - .env.test001
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    command: ["python", "-m", "app.core.scheduler.worker", "beat"]
    depends_on:
      - backend
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
    networks:
      - vanguard-internal
    healthcheck:
      disable: true

  telegram-growth-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-telegram-growth-worker
    env_file:
      - .env.test001
    environment:
      LOG_FILE: /app/logs/telegram-growth-worker.log
      LOG_RETENTION_DAYS: "15"
      LOG_STDOUT_LEVEL: WARNING
    mem_limit: 512m
    pids_limit: 128
    restart: on-failure:3
    command:
      [
        "python",
        "-m",
        "app.workers.telegram_worker",
        "--role",
        "growth_user_worker",
        "--worker-id",
        "growth_user_worker:test001",
      ]
    depends_on:
      - backend
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
      - ./sessions:/app/sessions
    networks:
      - vanguard-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      disable: true

  telegram-guardian-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-telegram-guardian-worker
    env_file:
      - .env.test001
    mem_limit: 512m
    pids_limit: 128
    restart: on-failure:3
    command:
      [
        "python",
        "-m",
        "app.workers.telegram_worker",
        "--role",
        "guardian_bot_worker",
        "--worker-id",
        "guardian_bot_worker:test001",
      ]
    depends_on:
      - backend
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads
    networks:
      - vanguard-internal
    healthcheck:
      disable: true

  napcat:
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:latest}
    container_name: vanguard-napcat
    restart: unless-stopped
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
    ports:
      - "127.0.0.1:6099:6099"
    expose:
      - "3000"
      - "3001"
    volumes:
      - napcat_qq_data:/app/.config/QQ
      - napcat_config:/app/napcat/config
      - napcat_plugins:/app/napcat/plugins
    networks:
      - vanguard-internal

  qq-onebot-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanguard-qq-onebot-worker
    env_file:
      - .env.test001
    mem_limit: 384m
    pids_limit: 96
    restart: on-failure:3
    command:
      [
        "python",
        "-m",
        "app.workers.qq_onebot_worker",
        "--worker-id",
        "qq_onebot_worker:test001",
      ]
    depends_on:
      - backend
      - redis
      - napcat
    volumes:
      - ./data/logs:/app/logs
    networks:
      - vanguard-internal
    healthcheck:
      disable: true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: vanguard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - vanguard-internal

  gateway:
    image: nginx:alpine
    container_name: vanguard-gateway
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx-gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - vanguard-internal

networks:
  vanguard-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  napcat_qq_data:
  napcat_config:
  napcat_plugins:
