# Vanguard host-Nginx configuration for oracle4c24g.
# Install as /etc/nginx/conf.d/vanguard.conf after the loopback services are
# healthy. This file intentionally does not alter the co-located Sub2API
# configuration in /etc/nginx/conf.d/sub2api.conf.

upstream vanguard_backend {
    server 127.0.0.1:18080;
    keepalive 32;
}

upstream vanguard_frontend {
    server 127.0.0.1:13000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name vanguard.pipenai.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vanguard.pipenai.xyz;

    # The wildcard Cloudflare Origin certificate is valid for this hostname.
    # Confirm the actual files and permissions on the target host before use.
    ssl_certificate /etc/nginx/ssl/pipenai.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/pipenai.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VanguardSSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50m;

    location /api/ws {
        proxy_pass http://vanguard_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://vanguard_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass http://vanguard_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass http://vanguard_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
