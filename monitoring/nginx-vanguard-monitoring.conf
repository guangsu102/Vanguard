# Include this file inside the existing vanguard.pipenai.xyz TLS server block.
# Create /etc/nginx/.htpasswd-vanguard-monitoring as root:www-data, mode 640
# (use the configured Nginx worker group if different).
location = /metrics {
    return 404;
}

location ^~ /monitoring/grafana/ {
    auth_basic "Vanguard monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd-vanguard-monitoring;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:13001;
}

location ^~ /monitoring/prometheus/ {
    auth_basic "Vanguard monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd-vanguard-monitoring;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://127.0.0.1:19090;
}

location ^~ /monitoring/alertmanager/ {
    auth_basic "Vanguard monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd-vanguard-monitoring;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://127.0.0.1:19093;
}
