global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: vanguard

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - path_prefix: /monitoring/alertmanager/
      static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: vanguard-backend
    metrics_path: /metrics
    bearer_token_file: /run/secrets/metrics.token
    static_configs:
      - targets: [backend:8000]
        labels: {service: backend}

  - job_name: vanguard-reconciliation
    metrics_path: /metrics
    bearer_token_file: /run/secrets/metrics.token
    static_configs:
      - targets: [reconciliation:8000]
        labels: {service: reconciliation}

  - job_name: vanguard-node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: vanguard-cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: vanguard-postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: vanguard-redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: vanguard-blackbox
    metrics_path: /probe
    params:
      module: [https_health]
    static_configs:
      - targets: [https://vanguard.pipenai.xyz/health]
        labels: {service: public-health}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
