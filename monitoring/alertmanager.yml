# ===========================================
# AlertManager Configuration - Telegram Only
# ===========================================

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'telegram'

receivers:
  - name: 'telegram'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: '${TELEGRAM_ALERT_CHAT_ID}'
        send_resolved: true
        message: |
          🔴 *{{ .GroupLabels.alertname }}*

          📊 *Severity:* `{{ .Labels.severity }}`

          📝 *Summary:*
          {{ range .Alerts }}{{ .Annotations.description }}{{ end }}

          ⏰ *Time:* {{ .GroupLabels.alertname }}

          🔗 *Link:* [View in Grafana]({{ .DashboardURL }})

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
