global:
  resolve_timeout: 5m

# First rollout keeps notifications inside Alertmanager/Grafana only.
route:
  receiver: monitoring-console
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: monitoring-console

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, service]
